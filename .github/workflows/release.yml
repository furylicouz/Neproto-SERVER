name: Release

on:
  push:
    tags:
      - 'np2-*'

permissions:
  contents: write

jobs:
  package-windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Validate tag and source version
        shell: pwsh
        run: |
          $version = (Get-Content -Raw VERSION).Trim()
          if ($env:GITHUB_REF_NAME -ne $version) { throw "Tag does not match VERSION" }

      - name: Build and verify Windows installer
        shell: pwsh
        run: |
          ./clients/windows/build.ps1 -Version "${{ github.ref_name }}"
          $setup = Get-Item "dist/windows/NeProto-Setup-${{ github.ref_name }}-x64.exe"
          & $setup.FullName /verify
          if ($LASTEXITCODE -ne 0) { throw "Installer payload verification failed" }

      - uses: actions/upload-artifact@v7
        with:
          name: neproto-windows-${{ github.ref_name }}
          path: |
            dist/windows/NeProto-Setup-${{ github.ref_name }}-x64.exe
            dist/windows/NeProto-Setup-${{ github.ref_name }}-x64.exe.sha256
          if-no-files-found: error

  package:
    needs: package-windows
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: neproto-web/package-lock.json

      - name: Validate tag and source version
        run: test "${GITHUB_REF_NAME}" = "$(tr -d '[:space:]' < VERSION)"

      - name: Build reproducible server bundle
        run: |
          epoch=$(git log -1 --format=%ct)
          SOURCE_DATE_EPOCH="$epoch" deploy/build-server-bundle.sh "$GITHUB_REF_NAME" dist

      - name: Run isolated installation lifecycle
        run: |
          mkdir -p /tmp/neproto-release
          legacy=np2-0.5.6
          legacy_name="neproto-server-bundle-$legacy.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            "https://github.com/furylicouz/Neproto-SERVER/releases/download/$legacy/$legacy_name" \
            --output "/tmp/neproto-release/$legacy_name"
          printf '%s  %s\n' \
            bd8f82907d2a3862b528a35c1f39a639cc1bc54cbd2557284bf9ef8e62ae8504 \
            "/tmp/neproto-release/$legacy_name" | sha256sum --check --status
          tar -xzf "/tmp/neproto-release/$legacy_name" -C /tmp/neproto-release
          tar -xzf "dist/neproto-server-bundle-$GITHUB_REF_NAME.tar.gz" -C /tmp/neproto-release
          sudo "/tmp/neproto-release/neproto-server-bundle-$GITHUB_REF_NAME/tests/legacy-updater-sandbox-smoke.sh" \
            "/tmp/neproto-release/neproto-server-bundle-$legacy"
          sudo "/tmp/neproto-release/neproto-server-bundle-$GITHUB_REF_NAME/tests/install-smoke.sh" amd64 "$GITHUB_REF_NAME"

      - uses: actions/download-artifact@v8
        with:
          name: neproto-windows-${{ github.ref_name }}
          path: dist/windows

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/neproto-server-bundle-${{ github.ref_name }}.tar.gz
            dist/neproto-server-bundle-${{ github.ref_name }}.tar.gz.sha256
            dist/windows/NeProto-Setup-${{ github.ref_name }}-x64.exe
            dist/windows/NeProto-Setup-${{ github.ref_name }}-x64.exe.sha256
