<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Service status</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f3f5f7; color: #17202a; }
    main { width: min(34rem, calc(100% - 3rem)); padding: 2.5rem; border-radius: 1rem; background: #fff; box-shadow: 0 1rem 3rem rgb(23 32 42 / 10%); }
    h1 { margin-top: 0; font-size: 1.6rem; }
    p { line-height: 1.6; color: #52606d; }
    .status { display: inline-flex; align-items: center; gap: .6rem; font-weight: 650; }
    .status::before { content: ""; width: .7rem; height: .7rem; border-radius: 50%; background: #20a464; box-shadow: 0 0 0 .25rem rgb(32 164 100 / 15%); }
    @media (prefers-color-scheme: dark) {
      body { background: #111820; color: #eef2f5; }
      main { background: #1a2530; box-shadow: none; }
      p { color: #b4c0ca; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Service status</h1>
    <p class="status">All systems operational</p>
    <p>This endpoint hosts a private service. There is no public account or API access here.</p>
  </main>
</body>
</html>
