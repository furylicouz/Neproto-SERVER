name: NeProto
options:
  bundleIdPrefix: com.neproto
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.4.0"
    CURRENT_PROJECT_VERSION: "4"
    SWIFT_STRICT_CONCURRENCY: targeted
    DEVELOPMENT_TEAM: Q97V3ZHHFH
packages:
  NeProtoCore:
    path: Core
targets:
  NeProto:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: NeProtoCore
      - target: PacketTunnel
        embed: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: NeProto
        UILaunchScreen: {}
        NeProtoKeychainAccessGroup: $(AppIdentifierPrefix)ru.neproto.shared
    entitlements:
      path: App/NeProto.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
        keychain-access-groups:
          - $(AppIdentifierPrefix)ru.neproto.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neproto.ios
        PRODUCT_NAME: NeProto
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: PacketTunnel
    dependencies:
      - package: NeProtoCore
      - framework: Frameworks/NP2Mobile.xcframework
        embed: false
    info:
      path: PacketTunnel/Info.plist
      properties:
        CFBundleDisplayName: NeProto Tunnel
        NeProtoKeychainAccessGroup: $(AppIdentifierPrefix)ru.neproto.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: PacketTunnel/PacketTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
        keychain-access-groups:
          - $(AppIdentifierPrefix)ru.neproto.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neproto.ios.PacketTunnel
        PRODUCT_NAME: PacketTunnel
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        SWIFT_OBJC_BRIDGING_HEADER: PacketTunnel/PacketTunnel-Bridging-Header.h
        OTHER_LDFLAGS: "$(inherited) -ObjC"
schemes:
  NeProto:
    build:
      targets:
        NeProto: all
        PacketTunnel: all
    run:
      config: Debug
    archive:
      config: Release
