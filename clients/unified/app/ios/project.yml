name: Runner
options:
  bundleIdPrefix: com.neproto
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Profile: release
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    CLANG_ENABLE_MODULES: YES
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: Q97V3ZHHFH
    MARKETING_VERSION: "0.5.26"
    CURRENT_PROJECT_VERSION: "26"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
packages:
  FlutterGeneratedPluginSwiftPackage:
    path: Flutter/ephemeral/Packages/FlutterGeneratedPluginSwiftPackage
  NeProtoCore:
    path: ../../../ios/Core
targets:
  Runner:
    type: application
    platform: iOS
    sources:
      - path: Runner
        excludes:
          - Info.plist
          - Runner.entitlements
    dependencies:
      - package: FlutterGeneratedPluginSwiftPackage
      - target: PacketTunnel
        embed: true
    configFiles:
      Debug: Flutter/Debug.xcconfig
      Profile: Flutter/Release.xcconfig
      Release: Flutter/Release.xcconfig
    preBuildScripts:
      - name: Flutter Build
        script: /bin/sh "$FLUTTER_ROOT/packages/flutter_tools/bin/xcode_backend.sh" build
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: Flutter Embed and Thin
        script: /bin/sh "$FLUTTER_ROOT/packages/flutter_tools/bin/xcode_backend.sh" embed_and_thin
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neproto.ios
        PRODUCT_NAME: NeProto
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_FILE: Runner/Info.plist
        CODE_SIGN_ENTITLEMENTS: Runner/Runner.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: Runner/Runner-Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: PacketTunnel
        excludes:
          - Info.plist
          - PacketTunnel.entitlements
    dependencies:
      - package: NeProtoCore
      - framework: Frameworks/NP2Mobile.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neproto.ios.PacketTunnel
        PRODUCT_NAME: PacketTunnel
        INFOPLIST_FILE: PacketTunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: PacketTunnel/PacketTunnel.entitlements
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        SWIFT_OBJC_BRIDGING_HEADER: PacketTunnel/PacketTunnel-Bridging-Header.h
        OTHER_LDFLAGS: "$(inherited) -ObjC"
  RunnerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RunnerTests
    dependencies:
      - target: Runner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neproto.ios.RunnerTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/NeProto.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/NeProto"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Runner:
    build:
      targets:
        Runner: all
        PacketTunnel: all
        RunnerTests: [test]
      preActions:
        - name: Run Prepare Flutter Framework Script
          script: /bin/sh "$FLUTTER_ROOT/packages/flutter_tools/bin/xcode_backend.sh" prepare
          settingsTarget: Runner
    run:
      config: Debug
      executable: Runner
    test:
      config: Debug
      macroExpansion: Runner
      targets:
        - RunnerTests
    archive:
      config: Release
